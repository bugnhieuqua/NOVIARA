services:
  - type: web
    name: noviara-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DB_ENGINE
        value: postgres
      # Bạn có thể thêm các biến môi trường bảo mật ở đây hoặc trên Dashboard
      # - key: DB_HOST
      #   sync: false
      # - key: DB_PASSWORD
      #   sync: false
      # - key: DATABASE_URL
      #   sync: false
      # - key: DIRECT_URL
      #   sync: false
      # - key: GEMINI_API_KEY
      #   sync: false
      # - key: GEMINI_MODEL
      #   value: gemini-2.5-flash